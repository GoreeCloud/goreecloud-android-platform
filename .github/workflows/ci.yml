name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate repository structure
        run: bash scripts/validate-repository.sh

  jvm-tests:
    name: JVM contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run JVM tests
        run: >-
          gradle --no-daemon
          :platform-core:test
          :identity-adapter:test
          :mesh-adapter:test
          :policy-adapter:test
          :testing:test

  android-build:
    name: Android build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and validate Android modules
        run: >-
          gradle --no-daemon
          :android-core:lintDebug
          :android-core:testDebugUnitTest
          :android-core:assembleDebug
          :glaze-ui:lintDebug
          :glaze-ui:testDebugUnitTest
          :glaze-ui:assembleDebug
